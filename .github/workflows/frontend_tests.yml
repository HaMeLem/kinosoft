name: Frontend Tests

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "frontend/src/app/**"
      - "frontend-intern/src/app/**"

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-intern/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install internal frontend dependencies
        run: npm ci
        working-directory: frontend-intern

      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend

      - name: Run internal frontend tests
        run: npm run test:ci
        working-directory: frontend-intern
