name: Backend Tests

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start PostgreSQL
        run: docker compose -f ../docker-compose.yml up --detach --wait postgres

      - name: Create test database
        run: |
          docker compose -f ../docker-compose.yml exec -T postgres \
            psql -U postgres -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
             WHERE datname = 'kinosoft_test' AND pid <> pg_backend_pid();
             DROP DATABASE IF EXISTS kinosoft_test;
             CREATE DATABASE kinosoft_test;"
          docker compose -f ../docker-compose.yml exec -T postgres \
            psql -U postgres -d kinosoft_test -c \
            "CREATE SCHEMA filmauswahl;
             CREATE SCHEMA kartenverkauf;
             CREATE SCHEMA einlasskontrolle;
             CREATE SCHEMA nutzerverwaltung;"

      - name: Run Maven tests
        run: ./mvnw --batch-mode clean verify

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f ../docker-compose.yml down --volumes
