server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
      # Upstream ueber eine Variable ansprechen, damit der resolver greift:
      # nginx loest "backend" dann zur Laufzeit (statt einmalig beim Start) via
      # Docker-DNS auf und ueberlebt so einen Neustart des Backend-Containers
      # (neue Container-IP). 127.0.0.11 ist der eingebaute Docker-DNS-Resolver.
      resolver 127.0.0.11 valid=10s;
      set $backend backend;
      proxy_pass http://$backend:8080$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
