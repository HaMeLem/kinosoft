spring.application.name=KinoSoft
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS filmauswahl\\;CREATE SCHEMA IF NOT EXISTS kartenverkauf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
# Keine SQL-Initialisierung mehr: Filmauswahl und Kartenverkauf werden zur Laufzeit aus dem
# Wochenplan befüllt (siehe WochenplanFixture). Die H2-Schemata legt der INIT-Teil der
# datasource-url an, die Tabellen erzeugt Hibernate (ddl-auto=update).
spring.sql.init.mode=never
