spring.application.name=KinoSoft
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kinosoft}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kinosoft-dev}
spring.jpa.hibernate.ddl-auto=update
# Keine SQL-Initialisierung mehr: Filmauswahl und Kartenverkauf werden zur Laufzeit aus dem
# Wochenplan befüllt (siehe WochenplanFixture). Die Schemas legt das PostgreSQL-Init-Skript
# an, die Tabellen erzeugt Hibernate (ddl-auto=update).
spring.sql.init.mode=never
