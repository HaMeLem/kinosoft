<div class="logout-overlay">
  <section
    class="logout-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-title"
  >
    <button
      type="button"
      class="logout-close"
      aria-label="Fenster schließen"
      (click)="schliessen.emit()"
    >
      ×
    </button>

    <div class="logout-icon" aria-hidden="true">
      ⇥
    </div>

    <h2 id="logout-title">
      Möchtest du dich wirklich ausloggen?
    </h2>

    <div class="logout-actions">
      <button
        type="button"
        class="logout-cancel"
        (click)="schliessen.emit()"
      >
        Nein, abbrechen
      </button>

      <a href="/" class="logout-confirm">
        Ja, ausloggen
      </a>
    </div>
  </section>
</div>
