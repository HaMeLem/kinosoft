<header class="app-header">
  @if (menueAnzeigen()) {
    <button
      class="menue-button"
      type="button"
      aria-label="Menü öffnen"
      title="Menü öffnen"
      (click)="menueOeffnen.emit()"
    >
      ☰
    </button>
  }

  <div class="app-logo">
    <strong>KinoSoft</strong>
    <span>Intern</span>
  </div>

  <button
    class="logout-button"
    type="button"
    aria-label="Abmelden"
    title="Abmelden"
    (click)="abmelden.emit()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M10 17l5-5-5-5" />
      <path d="M15 12H3" />
      <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
    </svg>
  </button>
</header>
