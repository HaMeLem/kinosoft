<main class="saaluebersicht">
  <header>
    <h1>Saalübersicht</h1>
  </header>

  <section class="zeitplan" aria-label="Zeitplan der Kinosäle">
    <div class="zeitachse">
      <span>Saal</span>

      @for (uhrzeit of uhrzeiten; track uhrzeit) {
        <span>{{ uhrzeit }}</span>
      }
    </div>

    @for (saal of saele; track saal.id) {
      <div class="saalzeile">
        <h2>{{ saal.name }}</h2>
        <div class="zeitbereich"></div>
      </div>
    }
  </section>
</main>
